name: Foliage report

# I LOVE NY publishes Wednesday afternoons. Grab it Wednesday evening and Thursday morning.
on:
  schedule:
    - cron: "5 23 * * 3"
    - cron: "5 10 * * 4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pressure-log
  cancel-in-progress: false

jobs:
  foliage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Render the report
        run: python3 tools/foliage.py
      - name: Commit if anything changed
        run: |
          git config user.name "Foliage report"
          git config user.email "noreply@anthropic.com"
          git add data/foliage.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Foliage report: $(date -u +'%Y-%m-%d %H:%MZ')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 15
          done
          exit 1
