name: Barograph log

# Every three hours, offset so it never overlaps the 6:59 a.m. Eastern
# edition build. Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: "23 1,4,7,13,16,19,22 * * *"
    - cron: "5,35 10 * * *"   # extra pre-build runs so the 6:59 paper has a fresh reading
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pressure-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and merge observations
        run: python3 tools/pressure_log.py
      - name: Commit if anything changed
        run: |
          git config user.name "Barograph"
          git config user.email "noreply@anthropic.com"
          git add data/pressure-log.csv data/pressure-summary.json
          if git diff --cached --quiet; then
            echo "no new readings"; exit 0
          fi
          git commit -m "Barograph: $(date -u +'%Y-%m-%d %H:%MZ')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 15
          done
          exit 1
