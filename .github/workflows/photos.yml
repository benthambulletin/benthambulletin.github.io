name: Family photos

# Fetches photos sent through the family form and hands them to the build as a
# short-lived workflow artifact. Nothing is committed: photos never land in this
# public repo (Garret, Oct 21). The build downloads the artifact, then deletes it.
on:
  workflow_dispatch:
    inputs:
      items:
        description: 'JSON list: [{"id": "<submission id>", "url": "<Tally file url>"}]'
        required: true

permissions:
  contents: read

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos
        env:
          ITEMS: ${{ inputs.items }}
        run: python3 tools/fetch_photos.py
      - uses: actions/upload-artifact@v4
        with:
          name: family-photos
          path: photo-out/
          retention-days: 1
          if-no-files-found: error
