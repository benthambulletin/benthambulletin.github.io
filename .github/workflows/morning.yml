name: Morning feed

# Official forecasts and a headline scan, ready before the 6:59 a.m. build.
# 10:31 UTC = 6:31 EDT; 11:31 UTC = 6:31 EST (after Nov 1). Also runnable by hand.
on:
  schedule:
    - cron: "31 10,11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pressure-log
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch forecasts and headlines
        run: python3 tools/morning_feed.py
      - name: Commit if anything changed
        run: |
          git config user.name "Morning feed"
          git config user.email "noreply@anthropic.com"
          git add data/forecast.json data/news.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Morning feed: $(date -u +'%Y-%m-%d %H:%MZ')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 15
          done
          exit 1
