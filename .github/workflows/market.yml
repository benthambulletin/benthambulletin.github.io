name: Market data (on request only)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/morning_feed.py --market
      - run: |
          git config user.name "Morning feed"
          git config user.email "noreply@anthropic.com"
          git add data/market.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Market data, on request"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done; exit 1
