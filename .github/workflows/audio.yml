name: Read-aloud audio

# Records each edition as an MP3 with a natural voice (Kokoro, open-source) so every phone hears
# the same good voice with nothing to download (Garret, Oct 22). The MP3 is committed to audio/<date>.mp3
# (last 7 days kept) so the site serves it; voice samples go to the "audio" release. The page's "Read it to me" button plays it, and
# falls back to the phone's own voice if it isn't there yet. Voice: VOICE below (Emma, British; Garret chose it Oct 22).
on:
  push:
    branches: [main]
    paths: ['data/edition-*.json']
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (default: today, Eastern)'
        required: false
      samples:
        description: 'Space-separated voices to make ~1-minute samples of instead (e.g. af_heart am_michael)'
        required: false

permissions:
  contents: write

concurrency:
  group: audio-${{ inputs.samples != '' && 'samples' || 'daily' }}
  cancel-in-progress: true

env:
  VOICE: bf_emma

jobs:
  audio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        timeout-minutes: 10
        run: |
          pip install --progress-bar off torch --index-url https://download.pytorch.org/whl/cpu
          pip install --progress-bar off "kokoro>=0.9" soundfile beautifulsoup4 lameenc "misaki[en]"
      - name: Record
        timeout-minutes: 15
        env:
          D: ${{ inputs.date }}
          SAMPLES: ${{ inputs.samples }}
        run: |
          if [ -z "$D" ]; then D=$(TZ=America/New_York date +%F); fi
          test -f data/edition-$D.json || { echo "no edition for $D"; exit 0; }
          mkdir -p out
          if [ -n "$SAMPLES" ]; then
            for v in $SAMPLES; do python3 tools/make_audio.py "$D" "$v" "out/sample-$v.mp3" 900; done
          else
            python3 tools/make_audio.py "$D" "$VOICE" "out/$D.mp3" 2> err.txt || { tail -c 600 err.txt | tr '\n' ' ' | sed 's/^/::error::/'; echo; exit 1; }
          fi
          echo "READY=1" >> $GITHUB_ENV
      - name: Publish
        if: env.READY == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SAMPLES: ${{ inputs.samples }}
        run: |
          if [ -n "$SAMPLES" ]; then
            gh release view audio >/dev/null 2>&1 || gh release create audio --title "Voice samples" --notes "Voice samples."
            gh release upload audio out/*.mp3 --clobber
            exit 0
          fi
          # Daily recording is served from the site itself (iPhones won't play it from the release
          # download server). Keep the last 7 days in the tree.
          git config user.name "Read-aloud audio"
          git config user.email "noreply@anthropic.com"
          for i in 1 2 3 4; do
            git pull --rebase -q origin main
            mkdir -p audio && cp out/*.mp3 audio/
            ls audio/*.mp3 | sort | head -n -7 | xargs -r git rm -q
            git add audio
            git diff --cached --quiet && exit 0
            git commit -qm "Read-aloud audio: $(ls out)"
            git push -q && exit 0
            git reset -q --hard origin/main; sleep 10
          done
          exit 1
