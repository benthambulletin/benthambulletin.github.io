<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Bentham Home Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f6f7f4; --surface:#ffffff; --line:#dfe3dc; --ink:#1f2a26; --muted:#65716b;
  --accent:#d9822b; --accent-soft:#fbead8;
  --garret:#2f6fb5; --garret-soft:#e2edf9; --kaylani:#c4476a; --kaylani-soft:#f8e3ea;
  --both:#3e8a5c; --both-soft:#e0f1e6;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree",-apple-system,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141a18; --surface:#1d2522; --line:#2e3935; --ink:#e8eeea; --muted:#9aa8a1;
  --accent:#f0a256; --accent-soft:#3a2a1a; --garret:#7fb0ea; --garret-soft:#1d2c3d;
  --kaylani:#ec8aa6; --kaylani-soft:#3b1f29; --both:#7cc79a; --both-soft:#1c3226; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:1.9rem;margin:0;letter-spacing:-.01em}
h2{font-family:var(--display);font-size:1.15rem;margin:0}
.date,.status{color:var(--muted);font-size:.88rem}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.tile .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.tile .s{font-size:.85rem;overflow-wrap:anywhere}
.tile.g .v{color:var(--garret)} .tile.ky .v{color:var(--kaylani)}
@media (max-width:480px){.strip{grid-template-columns:1fr 1fr}.strip .tile:first-child{grid-column:1/-1}}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{font:600 .92rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:grid;gap:14px}
.day h3{font-family:var(--display);font-weight:500;font-size:1rem;margin:0 0 6px;display:flex;gap:8px;align-items:baseline}
.day h3 small{color:var(--muted);font-family:var(--body);font-size:.8rem}
.day.today h3{color:var(--accent)}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.list li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
li .main{flex:1;min-width:0;overflow-wrap:anywhere}
li .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;min-width:62px}
li.done .main{text-decoration:line-through;color:var(--muted)}
.chip{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.Garret{background:var(--garret-soft);color:var(--garret)}
.chip.Kaylani{background:var(--kaylani-soft);color:var(--kaylani)}
.chip.Both{background:var(--both-soft);color:var(--both)}
.chip.luka{background:var(--accent-soft);color:var(--accent)}
.due{font-size:.78rem;color:var(--muted);white-space:nowrap}
.due.late{color:var(--kaylani);font-weight:600}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--both);flex:none}
.empty{color:var(--muted);font-size:.9rem;padding:6px 2px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:500 .82rem var(--body);border:1px solid var(--line);background:none;color:var(--muted);padding:4px 10px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.notes{grid-template-columns:1fr}}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.note .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.note .t{white-space:pre-wrap;overflow-wrap:anywhere}
.hint{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.88rem}
details summary{cursor:pointer;color:var(--muted);font-size:.88rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bentham Home Base</h1>
    <div class="date" id="today"></div>
    <div class="status" id="status">Loading…</div>
  </header>

  <section class="strip" aria-label="At a glance">
    <div class="tile"><div class="k">Next up</div><div class="s" id="nextUp">Nothing scheduled yet</div></div>
    <div class="tile g"><div class="k">Garret's to-dos</div><div class="v" id="cG">0</div></div>
    <div class="tile ky"><div class="k">Kaylani's to-dos</div><div class="v" id="cK">0</div></div>
  </section>

  <div class="hint">To add anything, <a href="https://tally.so/r/jeaE19" target="_blank" rel="noopener" style="color:inherit;font-weight:600">Tell Hearth</a>. It updates the board every evening. Check-marks save on this phone only.</div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="week" aria-selected="true">This week</button>
    <button role="tab" data-tab="todo" aria-selected="false">To-dos</button>
    <button role="tab" data-tab="grocery" aria-selected="false">Groceries</button>
    <button role="tab" data-tab="luka" aria-selected="false">Luka</button>
  </nav>

  <section class="panel" id="p-week">
    <div id="weekList" class="panel"></div>
    <details><summary>Later events</summary><ul class="list" id="laterList" style="margin-top:8px"></ul></details>
  </section>

  <section class="panel" id="p-todo" hidden>
    <div class="filters" id="tkFilter">
      <button data-f="all" aria-pressed="true">Everyone</button>
      <button data-f="Garret" aria-pressed="false">Garret</button>
      <button data-f="Kaylani" aria-pressed="false">Kaylani</button>
      <button data-f="Both" aria-pressed="false">Both</button>
    </div>
    <ul class="list" id="taskList"></ul>
  </section>

  <section class="panel" id="p-grocery" hidden>
    <ul class="list" id="groceryList"></ul>
  </section>

  <section class="panel" id="p-luka" hidden>
    <h2>Luka at a glance</h2>
    <div class="notes" id="lukaNotes"></div>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
const LUKA=[["bedtime","Bedtime routine"],["nap","Nap"],["meals","Meals & favorites"],["sizes","Clothes & shoe sizes"],["doctor","Pediatrician"],["school","Daycare / school"],["sitters","Sitters & backup care"],["now","Working on right now"]];
let D={events:[],tasks:[],groceries:[],luka:{}}, tkF="all", done={};
try{done=JSON.parse(localStorage.getItem("hb-done")||"{}")}catch(e){}
const saveDone=()=>{try{localStorage.setItem("hb-done",JSON.stringify(done))}catch(e){}};
const iso=d=>{const z=new Date(d);z.setMinutes(z.getMinutes()-z.getTimezoneOffset());return z.toISOString().slice(0,10)};
const T=iso(new Date());
$("#today").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
const esc=s=>{const d=document.createElement("div");d.textContent=s??"";return d.innerHTML};
const fmtTime=t=>{if(!t)return"All day";const[h,m]=t.split(":");const d=new Date();d.setHours(+h,+m);return d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})};
const sd=s=>new Date(s+"T12:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});
const wd=s=>new Date(s+"T12:00").toLocaleDateString(undefined,{weekday:"long"});

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["week","todo","grocery","luka"].forEach(t=>$("#p-"+t).hidden=t!==b.dataset.tab);
});
$("#tkFilter").onclick=e=>{const f=e.target.closest("button");if(!f)return;tkF=f.dataset.f;
  document.querySelectorAll("#tkFilter button").forEach(b=>b.setAttribute("aria-pressed",b===f));renderTasks()};
document.addEventListener("change",e=>{const k=e.target.dataset.k;if(!k)return;done[k]=e.target.checked;saveDone();renderTasks();renderGrocery()});

const evLi=(e,showDate)=>`<li><span class="time">${showDate?sd(e.date)+"<br>":""}${fmtTime(e.time)}</span><span class="main">${esc(e.title)}</span>${e.luka?'<span class="chip luka">Luka</span>':''}<span class="chip ${e.who}">${e.who}</span></li>`;
function renderEvents(){
  const s=D.events.filter(e=>e.date>=T).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
  let h="";
  for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()+i);const k=iso(d);const it=s.filter(e=>e.date===k);
    h+=`<div class="day ${i===0?"today":""}"><h3>${i===0?"Today":i===1?"Tomorrow":wd(k)} <small>${sd(k)}</small></h3>${it.length?`<ul class="list">${it.map(e=>evLi(e)).join("")}</ul>`:'<div class="empty">Nothing planned</div>'}</div>`}
  $("#weekList").innerHTML=h;
  const c=new Date();c.setDate(c.getDate()+7);const later=s.filter(e=>e.date>=iso(c));
  $("#laterList").innerHTML=later.length?later.map(e=>evLi(e,true)).join(""):'<li class="empty" style="border:0;background:none">Nothing past this week</li>';
  const n=s[0];$("#nextUp").innerHTML=n?`<strong>${esc(n.title)}</strong><br>${n.date===T?"Today":sd(n.date)} · ${fmtTime(n.time)}`:"Nothing scheduled yet";
}
function renderTasks(){
  const isDone=t=>!!done["t:"+(t.id||t.title)];
  const open=D.tasks.filter(t=>!isDone(t));
  $("#cG").textContent=open.filter(t=>t.who!=="Kaylani").length;
  $("#cK").textContent=open.filter(t=>t.who!=="Garret").length;
  const l=D.tasks.filter(t=>tkF==="all"||t.who===tkF).sort((a,b)=>(isDone(a)-isDone(b))||((a.due||"9").localeCompare(b.due||"9")));
  $("#taskList").innerHTML=l.length?l.map(t=>{const k="t:"+(t.id||t.title),d=isDone(t);
    return `<li class="${d?"done":""}"><input type="checkbox" data-k="${esc(k)}" ${d?"checked":""} aria-label="Done"><span class="main">${esc(t.title)}</span>${t.due?`<span class="due ${!d&&t.due<T?"late":""}">${t.due===T?"Today":sd(t.due)}</span>`:""}<span class="chip ${t.who}">${t.who}</span></li>`}).join(""):'<li class="empty" style="border:0;background:none">No to-dos here.</li>';
}
function renderGrocery(){
  $("#groceryList").innerHTML=D.groceries.length?D.groceries.map(g=>{const name=typeof g==="string"?g:g.item,k="g:"+name,d=!!done[k];
    return `<li class="${d?"done":""}"><input type="checkbox" data-k="${esc(k)}" ${d?"checked":""} aria-label="Got it"><span class="main">${esc(name)}</span></li>`}).join(""):'<li class="empty" style="border:0;background:none">The list is empty. Tell Claude what you need.</li>';
}
function renderLuka(){
  $("#lukaNotes").innerHTML=LUKA.map(([k,l])=>`<div class="note"><div class="k">${l}</div><div class="t">${D.luka[k]?esc(D.luka[k]):'<span class="empty">Not filled in yet</span>'}</div></div>`).join("");
}
fetch("data.json?"+Date.now()).then(r=>r.json()).then(j=>{D={...D,...j};
  $("#status").textContent="Updated "+sd(D.updated||T);renderEvents();renderTasks();renderGrocery();renderLuka();
}).catch(()=>{$("#status").textContent="Couldn't load the data. Pull down to refresh.";renderEvents();renderTasks();renderGrocery();renderLuka()});
</script>
</body>
</html>
