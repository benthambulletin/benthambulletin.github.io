<style>

.lede{font-family:'PFI';font-style:italic;text-align:center;color:var(--soft);margin:-.4rem 0 .9rem;font-size:1rem}

/* board */
.brow{border-bottom:1px solid var(--rule)}

.brow summary::-webkit-details-marker{display:none}
.brow .rk{font-family:'AR';font-weight:700;font-size:.75rem;color:var(--soft)}
.brow .nm{font-family:'PF';font-weight:700;font-size:1.15rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .nm .mv{font-family:'AR';font-size:.7rem;font-weight:700;margin-left:.35rem;vertical-align:.1em}

.brow.lead .nm,.brow.lead .rk{color:var(--red)}
.brow .tag{display:inline-block;font-family:'AR';font-weight:700;font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;padding:.05rem .4rem;border:1px solid;border-radius:2px;margin-left:.4rem;vertical-align:.15em}
.tag.clinched{color:var(--teal);border-color:var(--teal)}.tag.out{color:var(--soft);border-color:var(--rule)}
.tag.house{color:var(--gold);border-color:var(--gold)}
.bd{display:inline-block;font-size:1rem;line-height:1;margin-left:.22rem;vertical-align:-.08em;position:relative;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.bd sup{position:absolute;right:-.45em;top:-.35em;font-family:'AR';font-size:.5rem;font-weight:800;color:var(--paper);background:var(--red);border-radius:.6em;padding:0 .25em;line-height:1.3}
.bd.crown{animation:bob 2.6s ease-in-out infinite}
.bd.backdoor{animation:bob 2.6s ease-in-out infinite}
.bd.coin{animation:flip 4s linear infinite}
.bd.streak{animation:flicker 1.1s ease-in-out infinite}
.bd.wolf{animation:howl 3s ease-in-out infinite}
.bd.homer,.bd.traitor{animation:shake 5s ease-in-out infinite}
.bd.dead,.bd.cellar{animation:sink 3s ease-in-out infinite}
.bd.sweep{animation:sweep 3.5s ease-in-out infinite}

@keyframes howl{0%,80%,100%{transform:scale(1)}90%{transform:scale(1.25) rotate(-8deg)}}
@keyframes shake{0%,90%,100%{transform:translateX(0)}92%{transform:translateX(-2px)}94%{transform:translateX(2px)}96%{transform:translateX(-2px)}98%{transform:translateX(2px)}}
@keyframes sink{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}

<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById("data").textContent);
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function money(n){return "$"+(Math.round(n*100)/100).toString().replace(/\.00$/,"");}
function fmtWhen(iso){try{return new Date(iso).toLocaleString(undefined,{weekday:"short",hour:"numeric",minute:"2-digit"});}catch(e){return "";}}
function orn(t,teal){return '<div class="sec'+(teal?' t':'')+'"><span class="o">❦</span>'+t+'<span class="o">❦</span></div>';}

var BADGE={
  crown:   {i:"👑",l:"The Crown",d:"Won the week."},
  backdoor:{i:"🚪",l:"Backdoor",d:"Won the week on the tiebreaker."},
  wolf:    {i:"🐺",l:"Lone Wolf",d:"Only one in the room to call a game. Number is how many times."},
  coin:    {i:"🪙",l:"The Coin",d:"Currently behind Claude, who picks by coin flip."},
  homer:   {i:"🦬",l:"Homer Tax",d:"Picked the Bills or Jets. They lost."},
  traitor: {i:"🐍",l:"Traitor",d:"Picked against the Bills or Jets. They won."},
  dead:    {i:"☠️",l:"Dead",d:"Mathematically out of the week."},
  sweep:   {i:"🧹",l:"Clean Sweep",d:"Got every game in a kickoff window right."},
  early:   {i:"🐦",l:"Early Bird",d:"First sheet in this week."},
  buzzer:  {i:"🚨",l:"Buzzer Beater",d:"Filed inside the last hour before Thursday kickoff."},
  bigmouth:{i:"📣",l:"Big Mouth",d:"Talked trash. Finished last."},
  prophet: {i:"🔮",l:"Prophet",d:"Trash talk that came true. Commissioner's call."},
  streak:  {i:"🔥",l:"On Fire",d:"Consecutive correct picks, running across weeks. Number is the streak."},
  cellar:  {i:"💩",l:"Porta Potty",d:"Most last-place finishes this season. Somebody has to live there."},
  bridesmaid:{i:"🥈",l:"Bridesmaid",d:"Most second-place finishes without a win."},
  iron:    {i:"🛡️",l:"Iron Man",d:"Never missed a week."}
};
function badgesFor(p){
  var out=(p.badges||[]).slice();
  ((D.seasonBadges&&D.seasonBadges[p.name])||[]).forEach(function(b){out.push(b);});
  (D.awards||[]).forEach(function(a){ if(a.name===p.name) out.push({id:a.badge,note:a.note||""}); });
  var st=D.streak&&D.streak[p.name];
  if(st&&st>=3) out.push({id:"streak",n:st,note:st+" straight"});
  return out.filter(function(b){return BADGE[b.id];});
}
function badgeIcons(p){
  return badgesFor(p).map(function(b){
    return '<span class="bd '+esc(b.id)+'" title="'+esc(BADGE[b.id].l)+'">'+BADGE[b.id].i+(b.n&&b.n>1?'<sup>'+b.n+'</sup>':'')+'</span>';
  }).join('');
}
document.title=D.name; $("poolName").textContent=D.name;
$("cta").href=D.formUrl;
$("kickR").textContent=D.season+" · Week "+D.week;
$("tag").textContent=D.buyIn?"The Football Pool · Straight up, $"+D.buyIn+" a week, winner takes the pot":"The Football Pool · Straight up, free to play, bragging rights on the line";
var stTxt={pre:"Picks are open",live:"Games under way",final:"Final"}[D.status]||"";
$("dateline").innerHTML='Week '+D.week+' &middot; <span class="st '+esc(D.status)+'">'+esc(stTxt)+'</span>';
var nxt=D.status==="final"?"Next slate Tuesday":(D.status==="pre"?"Refreshes hourly":"Refreshes hourly during games · final after Monday night");
$("stamp").textContent=nxt;
(function(){
  var t=Date.parse(D.updated), mins=isNaN(t)?null:Math.max(0,Math.round((Date.now()-t)/60000));
  var ago=mins==null?"":(mins<1?"just now":mins<60?mins+" min ago":mins<120?"1 hr ago":Math.round(mins/60)+" hrs ago");
  var cls=mins==null?"":(mins<=70?"":mins<=180?"stale":"old");
  var nextTxt="Final";
  if(D.status!=="final"){
    var n=new Date(); n.setSeconds(0,0); n.setMinutes(7);
    if(n<=new Date()) n.setHours(n.getHours()+1);
    var hr=n.getHours();
    if(hr<8||hr>23){ n.setHours(8); if(hr>23) n.setDate(n.getDate()+1); }
    nextTxt="Next refresh "+n.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  }
  $("fresh").innerHTML='<span><span class="dot '+cls+'"></span>Updated <b>'+esc(fmtWhen(D.updated))+'</b>'+(ago?' · '+esc(ago):'')+'</span><span>'+nextTxt+'</span>';
})();

var played=D.games.filter(function(g){return g.winner&&g.winner!=="TIE";}).length;
var left=D.games.filter(function(g){return !g.winner;}).length;
var entrants=D.players.filter(function(p){return !p.house;}).length, pot=D.buyIn*entrants;
var ps=D.players.slice().sort(function(a,b){return (b.correct-a.correct)||(a.missed-b.missed)||a.name.localeCompare(b.name);});
var realPs=ps.filter(function(p){return !p.house;});
var top=realPs.length?realPs[0].correct:0;

/* tiles */
var t3;
if(D.status==="final"&&D.weekWinners.length) t3=D.weekWinners.length>1?{v:"Split "+D.weekWinners.length+" ways",k:"this week",red:true}:{v:esc(D.weekWinners[0]),k:"takes the week",red:true};
else if(D.status==="live"&&realPs.length&&top>0){var leaders=realPs.filter(function(p){return p.correct===top;});
  t3=leaders.length>1?{v:leaders.length+"-way tie",k:"at "+top+" right",red:true}:{v:esc(leaders[0].name),k:"leading, "+top+" right",red:true};}
else {var first=D.games[0];t3={v:esc((first.when||"").replace(/ · .*$/,"")),k:"first kickoff"};}
$("tiles").innerHTML=
 (D.buyIn
   ? '<div class="tile"><div class="v red">'+money(D.status==="final"?D.weekPayout:pot)+'</div><div class="k">'+(D.status==="final"?"paid out":"in the pot")+'</div></div>'
   : '<div class="tile"><div class="v red">Free</div><div class="k">to play, for now</div></div>')+
 '<div class="tile"><div class="v">'+entrants+'</div><div class="k">'+(entrants===1?"entry":"entries")+(D.status==="pre"?" so far":"")+'</div></div>'+
 '<div class="tile"><div class="v'+(t3.red?' red':'')+'">'+t3.v+'</div><div class="k">'+t3.k+'</div></div>';
if(D.status==="final"){$("cta").textContent="Week "+(D.week+1)+" picks";}
if(D.status==="live"){$("cta").classList.add("quiet");$("cta").textContent="Late sheet? Remaining games count";}

var h="";

/* board */
h+=orn("The Board");
var sealedN=D.games.filter(function(g){return g.status==="sealed";}).length;
if(!ps.length){
  h+='<div class="empty">Nobody has filed yet. The board fills in as sheets come in.</div>';
} else if(D.status==="pre"){
  h+='<div class="lede">Sheets in the drawer, sealed until kickoff.</div>';
  h+='<p class="filed"><b>Filed:</b> '+ps.map(function(p){return esc(p.name);}).join(", ")+'.</p>';
  h+='<p class="filed">Changed your mind? Submit the form again. Your latest sheet before each kickoff is the one that counts. Once games start, tap your name here to see your picks.</p>';
} else {
  h+='<div class="bhead"><span>#</span><span>Player</span><span>Rec</span><span>Left</span><span>Max</span></div>';
  ps.forEach(function(p){
    var lead=p.rank===1&&p.correct>0&&!p.house;
    var mv=p.delta>0?'<span class="mv up">▲'+p.delta+'</span>':(p.delta<0?'<span class="mv dn">▼'+(-p.delta)+'</span>':'');
    var tag=p.house?'<span class="tag house">House</span>':(p.state==="clinched"?'<span class="tag clinched">Clinched</span>':(p.state==="out"?'<span class="tag out">Out</span>':''));
    h+='<details class="brow'+(lead?' lead':'')+(p.house?' house':'')+'"><summary><span class="rk">'+p.rank+'</span>'+
       '<span class="nm">'+esc(p.name)+mv+tag+badgeIcons(p)+'</span><span class="rec">'+p.correct+'–'+p.missed+'</span>'+
       '<span class="lf"><b>'+p.remaining+'</b></span><span class="mx"><b>'+p.max+'</b></span></summary><div class="sheet">';
    var earned=badgesFor(p);
    if(earned.length){
      h+='<div class="earned">'+earned.map(function(b){return '<span class="bd '+esc(b.id)+'">'+BADGE[b.id].i+'</span>'+esc(BADGE[b.id].l)+(b.note?' — '+esc(b.note):'');}).join('<br>')+'</div>';
    }
    var lines=[];
    D.games.forEach(function(g,i){
      if(g.status==="sealed") return;
      var pk=p.sheet?p.sheet[String(i)]:undefined;
      if(pk===null||pk===undefined) lines.push('<span class="no">'+esc(g.away)+'@'+esc(g.home)+' no pick</span>');
      else if(!g.winner) lines.push('<span class="pend">'+esc(pk)+'</span>');
      else if(g.winner==="TIE") lines.push(esc(pk)+' (tie)');
      else lines.push('<span class="'+(pk===g.winner?'ok':'no')+'">'+esc(pk)+'</span>');
    });
    h+=lines.join(' · ')+(sealedN?' · <span class="sealed">'+sealedN+' sealed</span>':'');
    var hm=D.homer&&D.homer[p.name];
    if(hm&&(hm.bills[0]+hm.bills[1]+hm.jets[0]+hm.jets[1])>0) h+='<br>Season on Bills games '+hm.bills[0]+'–'+hm.bills[1]+' · Jets games '+hm.jets[0]+'–'+hm.jets[1];
    if(p.tb!=null&&D.games[D.games.length-1].status!=="sealed") h+='<br>Tiebreaker '+p.tb;

    h+='</div></details>';
  });
}

/* what decides it */
if(D.status==="live"&&D.decides&&D.decides.length){
  h+=orn("What Decides It",true)+'<div class="lede">Games still open where the contenders split.</div>';
  D.decides.forEach(function(d){
    var g=D.games[d.game];
    h+='<div class="dec"><div class="m">'+esc(g.away)+' <span class="at">at</span> '+esc(g.home)+' <span class="at">· '+esc(g.status==="live"?"in progress":g.when)+'</span></div>'+
       '<div class="who"><b>'+esc(g.away)+':</b> '+esc(d.away.join(", "))+' &nbsp;·&nbsp; <b>'+esc(g.home)+':</b> '+esc(d.home.join(", "))+'</div></div>';
  });
}

/* by the numbers */
if(D.status!=="pre"&&D.stats&&D.stats.decided>0){
  var S=D.stats, G=D.games;
  h+=orn("By the Numbers",true)+'<div class="num">';
  h+='<div class="it"><div class="k">Upset rate</div><div class="v">'+S.upsets+' of '+S.decided+'</div><div class="d">Games where the smaller side of the room was right.</div></div>';
  if(S.best){var bg=G[S.best.game];h+='<div class="it"><div class="k">Best pick</div><div class="v">'+esc(bg.winner)+'</div><div class="d">'+esc(bg.away)+' at '+esc(bg.home)+'. Only <b>'+esc(S.best.who.join(", "))+'</b> had it.</div></div>';}
  if(S.worst&&S.worst.n===0){var wg=G[S.worst.game];h+='<div class="it"><div class="k">Nobody had</div><div class="v">'+esc(wg.winner)+'</div><div class="d">'+esc(wg.away)+' at '+esc(wg.home)+'. The whole room, wrong.</div></div>';}
  if(S.bills){h+='<div class="it"><div class="k">Bills game</div><div class="v">'+S.bills.right+'–'+S.bills.wrong+'</div><div class="d">The room on '+esc(G[S.bills.game].away)+' at '+esc(G[S.bills.game].home)+'.'+(S.bills.won?' Bills won.':' Bills lost.')+'</div></div>';}
  if(S.jets){h+='<div class="it"><div class="k">Jets game</div><div class="v">'+S.jets.right+'–'+S.jets.wrong+'</div><div class="d">The room on '+esc(G[S.jets.game].away)+' at '+esc(G[S.jets.game].home)+'.'+(S.jets.won?' Jets won.':' Jets lost.')+'</div></div>';}
  var hp=ps.filter(function(p){return p.house;})[0];
  if(hp){var beat=realPs.filter(function(p){return p.correct<hp.correct;}).length;h+='<div class="it"><div class="k">'+esc(hp.name)+', the coin</div><div class="v">'+hp.correct+'–'+hp.missed+'</div><div class="d">'+(beat?'Ahead of <b>'+beat+'</b> of you.':'Behind everyone. For now.')+'</div></div>';}
  h+='</div>';
}

/* ticker */
if(D.updates&&D.updates.length){
  h+=orn("The Ticker");
  D.updates.slice().reverse().slice(0,6).forEach(function(u){
    h+='<div class="tick"><div class="at">'+esc(fmtWhen(u.at))+'</div><div class="n">'+esc(u.note)+'</div></div>';
  });
}

/* column */
if(D.column||D.trash.length){
  h+=orn("The Column",true)+'<div class="byline">From the commissioner’s desk · grudges printed as received</div><div class="col">';
  if(D.column) D.column.split(/\n\n+/).forEach(function(p){h+='<p>'+esc(p)+'</p>';});
  D.trash.forEach(function(t){h+='<div class="pq"><div class="q">“'+esc(t.text)+'”</div><div class="who">'+esc(t.from)+'</div></div>';});
  h+='</div>';
}

/* slate */
h+=orn("The Slate");
var lastSlot="";
D.games.forEach(function(g,i){
  var slot=(g.when||"").replace(/\s+\d{1,2}:\d{2}\s*[AP]M.*$/,"").replace(/^(Sun|Mon|Thu|Sat)\b/,function(m){return {Sun:"Sunday",Mon:"Monday",Thu:"Thursday",Sat:"Saturday"}[m];});
  var time=(g.when||"").replace(/^\w{3}\s+/,"");
  if(slot!==lastSlot){h+='<div class="slot">'+esc(slot)+'</div>';lastSlot=slot;}
  var m, s;
  if(g.winner==="TIE"){m=esc(g.away)+' <span class="at">at</span> '+esc(g.home);s='<span class="s fin">Tie · nobody</span>';}
  else if(g.winner){var aw=g.winner===g.away;
    m='<span class="'+(aw?'w':'')+'">'+esc(g.away)+'</span> <span class="at">at</span> <span class="'+(aw?'':'w')+'">'+esc(g.home)+'</span>';
    s='<span class="s fin">'+esc(g.score||"Final")+'</span>';}
  else if(g.status==="live"){m=esc(g.away)+' <span class="at">at</span> '+esc(g.home);s='<span class="s live">In progress</span>';}
  else {m=esc(g.away)+' <span class="at">at</span> '+esc(g.home);s='<span class="s">'+esc(time)+'</span>';}
  h+='<div class="g"><div class="m">'+m+'</div>'+s;
  if(g.status==="sealed"&&D.status!=="pre"&&ps.length) h+='<div class="n"><span class="lab">Picks</span><span class="sealed">sealed until kickoff</span></div>';
  var gs=D.stats&&D.stats.games&&D.stats.games[String(i)];
  if(g.status==="final"&&gs){
    h+='<div class="n"><span class="lab">Split</span><span class="side">'+esc(g.away)+'<span class="cnt">'+gs.away+'</span> · '+esc(g.home)+'<span class="cnt">'+gs.home+'</span>'+(gs.upset?' · <b style="color:var(--red)">upset</b>':'')+'</span></div>';
  }
  if(g.status==="live"&&g.sides){
    var A=g.sides[g.away]||[],H=g.sides[g.home]||[];

  }
  if((g.hits&&g.hits.length)||(g.misses&&g.misses.length)){
    h+='<div class="n">';

    if(g.misses&&g.misses.length) h+=(g.hits&&g.hits.length?'<br>':'')+'<span class="lab">Wrong</span><span class="x">'+esc(g.misses.join(", "))+'</span>';

  var ss=D.season_table.slice().sort(function(a,b){return (b.won-a.won)||(b.correct-a.correct)||a.name.localeCompare(b.name);});
  h+='<table class="stand seas"><thead><tr><th>Player</th><th>W</th><th>L</th><th>Weeks</th>'+(D.buyIn?'<th>Won</th>':'')+'</tr></thead><tbody>';
  ss.forEach(function(p,i){h+='<tr><td class="nm"><span class="rk">'+(i+1)+'</span>'+esc(p.name)+'</td><td>'+p.correct+'</td><td>'+p.missed+'</td><td>'+(p.weeksWon||"—")+'</td>'+(D.buyIn?'<td class="money">'+(p.won?money(p.won):"—")+'</td>':'')+'</tr>';});
  h+='</tbody></table>';
} else {
  h+='<div class="empty">No weeks in the books. The ledger opens after Week '+D.week+'.</div>';
}

/* badge key */
h+=orn("The Badges",true)+'<div class="lede">Earned from the picks. They sit next to your name on the board.</div><div class="key">';
Object.keys(BADGE).forEach(function(k){h+='<div class="ki"><span class="bd">'+BADGE[k].i+'</span><div><b>'+esc(BADGE[k].l)+'</b><span>'+esc(BADGE[k].d)+'</span></div></div>';});
h+='</div>';

/* rules */
h+=orn("House Rules")+'<div class="rules">'+
(D.buyIn
  ? '<b>$'+D.buyIn+' a week</b>, Venmo @garretbentham before Sunday. Whole pot to the best record, nothing held back. '
  : '<b>Free to play right now.</b> No buy-in, no pot. If enough people want it, it becomes $'+(D.plannedBuyIn||5)+' a week with the whole pot to the best record, and you\'ll hear about it here first. ')+
'Pick every game straight up. '+
'Each game locks at its own kickoff: submit after one starts and that game is void, the rest count. Your latest sheet before each kickoff is the one that counts. '+
'<b>Tiebreaker</b> is the total combined points in the Monday night game, both teams added together. Still tied, the pot splits. '+
'Skipping a week is free. A tied game counts for nobody. Trash talk runs as written.</div>';

$("root").innerHTML=h;
})();
</script>
</body>
</html>
