<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="The Sunday Tax — a free NFL pick 'em. Pick every game straight up, talk your trash, lose your face.">
<meta property="og:title" content="The Sunday Tax">
<meta property="og:description" content="Pick every game. Talk your trash. Lose your face. Standings, live scores and the column.">
<meta property="og:image" content="https://benthambulletin.github.io/pool/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://benthambulletin.github.io/pool/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" href="/pool/icon.png">
<link rel="icon" type="image/png" href="/pool/icon.png">
<meta name="apple-mobile-web-app-title" content="Sunday Tax">
<meta name="theme-color" content="#fbf5e4">
<meta http-equiv="Cache-Control" content="no-cache">
<title>The Sunday Tax</title>
<style>
@font-face{font-family:'PF';src:url(/assets/fonts/PlayfairDisplay.ttf);font-weight:100 900;font-display:swap}
@font-face{font-family:'PFI';src:url(/assets/fonts/PlayfairDisplay-Italic.ttf);font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:'LO';src:url(/assets/fonts/Lora.ttf);font-weight:100 900;font-display:swap}
@font-face{font-family:'LOI';src:url(/assets/fonts/Lora-Italic.ttf);font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:'AR';src:url(/assets/fonts/Archivo.ttf);font-weight:100 900;font-display:swap}
:root{--paper:#fbf5e4;--ink:#1c170f;--red:#c8302f;--teal:#0e8a8a;--gold:#e8b100;--soft:#5f5238;--rule:#d6cbaf;--wash:#f3ead2}
*{box-sizing:border-box}
html{background:#ece4d1}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'LO',Georgia,serif;font-size:1.1rem;line-height:1.5;font-weight:480;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
.page{max-width:44rem;margin:0 auto;padding:1.1rem 1.1rem 2.4rem}
a{color:inherit}

/* masthead */
.kicker{display:flex;justify-content:space-between;gap:1rem;font-family:'AR';font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:600;margin-bottom:.4rem}
.dbl .a{height:3px;background:var(--ink)}.dbl .b{height:1px;background:var(--ink);margin-top:3px}
.dbl{margin:.5rem 0 .9rem}.dbl.tight{margin:.7rem 0 .6rem}
h1{margin:.5rem 0 0;text-align:center;font-family:'PF';font-weight:800;font-size:clamp(2.2rem,10vw,3.4rem);line-height:.95;letter-spacing:-.01em}
.tag{text-align:center;font-family:'AR';font-weight:700;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-top:.45rem}
.orn{text-align:center;color:var(--gold);font-size:1rem;letter-spacing:.9em;margin:.5rem 0 .4rem}
.dateline{text-align:center;font-family:'AR';font-weight:800;font-size:.95rem;letter-spacing:.14em;text-transform:uppercase}
.dateline .st{color:var(--red)}.dateline .st.final{color:var(--teal)}
.nav{display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem 1.8rem;font-family:'AR';font-weight:700;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;padding:.8rem 0 .2rem}
.nav a{text-decoration:none;color:var(--teal)}
.nav a.about{color:var(--soft)}
.more{margin:2rem 0 0;padding:.9rem 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);text-align:center;font-size:.95rem;color:var(--soft)}
.more a{color:var(--teal);font-family:'AR';font-weight:700;font-size:.9rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}

html{scroll-padding-top:3.4rem}
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border-bottom:2px solid var(--ink);margin:0 -1.1rem;padding:0 1.1rem}
.tabs a{display:flex;align-items:center;justify-content:center;min-height:3rem;text-align:center;text-decoration:none;font-family:'AR';font-weight:800;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs a.on{color:var(--ink);border-bottom-color:var(--red)}
.tabs a.go{color:var(--red)}
/* right now */
.now{margin:1rem 0 0;text-align:center}
.now .nk{font-family:'AR';font-weight:800;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.now .nk.final{color:var(--teal)}
.now .nl{font-family:'PF';font-weight:800;font-size:clamp(2rem,10vw,2.9rem);line-height:1.05;margin:.35rem 0 .2rem;letter-spacing:-.01em}
.now .nl .sc{white-space:nowrap}
.now .ns{font-family:'AR';font-weight:700;font-size:.85rem;letter-spacing:.04em;color:var(--soft);line-height:1.45}
.now .ns b{color:var(--ink)}
.now .nn{margin:.85rem 0 0;padding:.55rem .7rem;border:1px solid var(--rule);background:var(--wash);border-radius:3px;font-family:'AR';font-weight:700;font-size:.8rem;letter-spacing:.03em;color:var(--soft);line-height:1.5}
.now .nn b{color:var(--ink)}
.now .nn .cd{color:var(--red);white-space:nowrap}
.now .fresh{justify-content:center;gap:.2rem 1rem;border-bottom:0;padding:.55rem 0 0;font-size:.7rem}
.hint{text-align:center;font-family:'AR';font-weight:700;font-size:.78rem;letter-spacing:.06em;color:var(--soft);margin:-.3rem 0 .7rem}
.brow .rec::after{content:"›";display:inline-block;margin-left:.45rem;color:var(--teal);font-family:'AR';font-weight:800;transition:transform .15s}
.brow[open] .rec::after{transform:rotate(90deg)}
details.g summary .s::after{content:"›";display:inline-block;margin-left:.4rem;color:var(--teal);font-weight:800;transition:transform .15s}
details.g[open] summary .s::after{transform:rotate(90deg)}
.cal[hidden]{display:none}
.cal{display:block;margin:.55rem 0 0;font-family:'AR';font-weight:700;font-size:.8rem;letter-spacing:.06em;color:var(--teal);text-decoration:none}
.pastwk{margin:1rem 0 0;text-align:center;font-family:'AR';font-weight:700;font-size:.85rem;line-height:2}
.pastwk a{color:var(--teal);text-decoration:none;margin:0 .5rem;white-space:nowrap}
/* tiles */
.tiles{display:flex;margin-top:1rem;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.tile{flex:1;text-align:center;padding:.6rem .2rem;border-right:1px solid var(--rule);min-width:0}
.tile:last-child{border-right:0}
.tile .v{font-family:'PF';font-weight:800;font-size:clamp(1.4rem,6.5vw,2.3rem);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v.red{color:var(--red)}
.tile .k{font-family:'AR';font-weight:700;font-size:.55rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-top:.2rem}
.fresh{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.2rem .6rem;font-family:'AR';font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);padding:.45rem .1rem;border-bottom:1px solid var(--rule)}
.fresh b{color:var(--ink);font-weight:700}
.fresh .dot{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:var(--teal);margin-right:.35rem;vertical-align:.02em}
.fresh .dot.stale{background:var(--gold)}.fresh .dot.old{background:var(--red)}

/* the mugshot */
.mug{margin:1.2rem 0 0;border:3px double var(--ink);padding:.7rem .8rem .6rem;display:grid;grid-template-columns:6.2rem 1fr;gap:0 .9rem;align-items:center;background:var(--wash)}
.mug img{width:6.2rem;height:6.2rem;object-fit:cover;border:1px solid var(--ink);display:block;transform:rotate(-2deg);box-shadow:2px 2px 0 var(--rule)}
.mug .k{font-family:'AR';font-weight:800;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.mug .n{font-family:'PF';font-weight:800;font-size:1.5rem;line-height:1.1;margin:.1rem 0}
.mug .d{font-size:.92rem;color:var(--soft);line-height:1.35}
.mug .d b{color:var(--ink);font-weight:600}
/* cta */
.cta{display:block;margin:1rem 0 0;text-align:center;background:var(--red);color:#fff;text-decoration:none;font-family:'AR';font-weight:800;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;padding:.85rem;border-radius:3px}
.cta.quiet{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.closes{text-align:center;font-family:'AR';font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:.45rem 0 0}
.closes b{color:var(--red)}
.closes a{color:var(--teal);text-decoration:none}
.ack{margin:1rem 0 0;border:3px double var(--teal);background:var(--wash);padding:.7rem .9rem;text-align:center}
.ack .k{font-family:'AR';font-weight:800;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.ack .n{font-family:'PF';font-weight:800;font-size:1.35rem;line-height:1.15;margin:.15rem 0}
.ack .d{font-size:.92rem;color:var(--soft);line-height:1.4}
.ack .d a{color:var(--teal)}
.ruleref{color:var(--teal);text-decoration:none}
.sheet .earned a{color:inherit;text-decoration:underline dotted var(--rule)}
.cta:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

/* sections */
.sec{text-align:center;font-family:'AR';font-weight:800;font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;margin:1.9rem 0 .9rem;padding-top:1.1rem;border-top:1px solid var(--rule);color:var(--red)}
.sec.t{color:var(--teal)}
.sec .o{color:var(--gold);margin:0 .7rem;letter-spacing:0}
#root>.sec:first-of-type{margin-top:1.4rem;padding-top:0;border-top:0}
.lede{font-family:'PFI';font-style:italic;text-align:center;color:var(--soft);margin:-.4rem 0 .9rem;font-size:1rem}

/* board */
.brow{border-bottom:1px solid var(--rule)}
.brow summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1.6rem 1fr auto;gap:0 .6rem;align-items:baseline;padding:.55rem 0}
.brow summary::-webkit-details-marker{display:none}
.brow .rk{font-family:'AR';font-weight:700;font-size:.75rem;color:var(--soft)}
.brow .nm{font-family:'PF';font-weight:700;font-size:1.15rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .nm .mv{font-family:'AR';font-size:.7rem;font-weight:700;margin-left:.35rem;vertical-align:.1em}
.brow .nm .mv.up{color:var(--teal)}.brow .nm .mv.dn{color:var(--red)}
.brow .dots{grid-column:2/4;display:flex;flex-wrap:wrap;gap:3px;margin-top:.3rem}
.brow .dots i{display:block;width:9px;height:9px;border-radius:50%;background:var(--rule)}
.brow .dots i.ok{background:var(--teal)}.brow .dots i.no{background:var(--red)}.brow .dots i.p{background:transparent;box-shadow:inset 0 0 0 1.5px var(--soft)}
.brow .rec{font-family:'PF';font-weight:800;font-size:1.15rem;text-align:right}
.brow.lead .nm,.brow.lead .rk{color:var(--red)}
.brow .tag{display:inline-block;font-family:'AR';font-weight:700;font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;padding:.05rem .4rem;border:1px solid;border-radius:2px;margin-left:.4rem;vertical-align:.15em}
.tag.clinched{color:var(--teal);border-color:var(--teal)}.tag.out{color:var(--soft);border-color:var(--rule)}
.tag.house{color:var(--gold);border-color:var(--gold)}
.bd{display:inline-block;font-size:1rem;line-height:1;margin-left:.22rem;vertical-align:-.08em;position:relative;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.bd sup{position:absolute;right:-.45em;top:-.35em;font-family:'AR';font-size:.5rem;font-weight:800;color:var(--paper);background:var(--red);border-radius:.6em;padding:0 .25em;line-height:1.3}
.bd.crown{animation:bob 2.6s ease-in-out infinite}
.bd.coin{animation:flip 4s linear infinite}
.bd.streak{animation:flicker 1.1s ease-in-out infinite}
.bd.wolf{animation:howl 3s ease-in-out infinite}
.bd.homer{animation:shake 5s ease-in-out infinite}
.bd.cellar,.bd.dead{animation:sink 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-2px) rotate(6deg)}}
@keyframes flip{0%,60%{transform:rotateY(0)}80%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
@keyframes flicker{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15) translateY(-1px);opacity:.85}}
@keyframes howl{0%,80%,100%{transform:scale(1)}90%{transform:scale(1.25) rotate(-8deg)}}
@keyframes shake{0%,90%,100%{transform:translateX(0)}92%{transform:translateX(-2px)}94%{transform:translateX(2px)}96%{transform:translateX(-2px)}98%{transform:translateX(2px)}}
@keyframes sink{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
@media (prefers-reduced-motion:reduce){.bd{animation:none!important}}
.sheet .earned{margin:.1rem 0 .35rem;color:var(--ink)}
.sheet .earned .bd{margin:0 .25rem 0 0}
details.fold summary{list-style:none;cursor:pointer;font-family:'AR';font-weight:700;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);padding:.4rem 0}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:" +";}
details.fold[open] summary::after{content:" –";}
.tt{margin:.4rem 0 0;padding:0;list-style:none}
.tt li{padding:.35rem 0;border-top:1px dotted var(--rule);font-family:'PFI';font-style:italic;font-size:1.05rem;line-height:1.3}
.tt li b{font-family:'AR';font-style:normal;font-weight:700;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-left:.4rem}
.brow.house .nm,.brow.house .rec{color:var(--soft)}
.num{display:grid;grid-template-columns:1fr 1fr;gap:.6rem .9rem}
@media (max-width:380px){.num{grid-template-columns:1fr}}
.num .it{border-top:2px solid var(--ink);padding-top:.35rem}
.num .k{font-family:'AR';font-weight:700;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.num .v{font-family:'PF';font-weight:800;font-size:1.5rem;line-height:1.05;margin:.1rem 0}
.num .d{font-size:.9rem;color:var(--soft);line-height:1.35}
.num .d b{color:var(--ink);font-weight:600}
.sheet{padding:.2rem 0 .7rem 2.2rem;font-family:'AR';font-size:.75rem;line-height:1.7;color:var(--soft)}
.sheet .ok{color:var(--teal);font-weight:600}.sheet .no{color:var(--red);font-weight:600;text-decoration:line-through}
.sheet .pend{color:var(--ink)}.sheet .sealed{font-style:italic}
.bhead{display:grid;grid-template-columns:1.6rem 1fr auto;gap:0 .6rem;font-family:'AR';font-weight:700;font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);padding:.3rem 0;border-bottom:2px solid var(--ink)}
.bhead span:nth-child(n+3){text-align:right}

/* standings */
table{width:100%;border-collapse:collapse}
.stand th{font-family:'AR';font-weight:700;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);text-align:right;padding:.3rem .25rem;border-bottom:2px solid var(--ink)}
.stand th:first-child,.stand td:first-child{text-align:left;padding-left:0}
.stand th:last-child,.stand td:last-child{padding-right:0}
.stand td{padding:.5rem .25rem;border-bottom:1px solid var(--rule);text-align:right;font-size:1.05rem}
.stand td.nm{font-family:'PF';font-weight:700;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0;width:52%}
.stand td.nm .rk{display:inline-block;width:1.5rem;font-family:'AR';font-weight:700;font-size:.75rem;color:var(--soft)}
.stand tr.lead td.nm{color:var(--red)}
.stand tr.lead td.nm .rk{color:var(--red)}
.stand td.rec{font-family:'PF';font-weight:800;font-size:1.15rem}
.stand td.tb{color:var(--soft);font-size:.95rem}
.filed{font-size:1rem;color:var(--soft)}
.filed b{color:var(--ink);font-weight:600}

/* column */
.col p{margin:0 0 .85rem;font-size:1.1rem}
.col p:first-of-type::first-letter{font-family:'PF';font-weight:800;font-size:3.1rem;line-height:.8;float:left;padding:.28rem .45rem 0 0;color:var(--red)}
.pq{margin:1rem 0 1rem;padding:.6rem 0 .6rem 1rem;border-left:3px solid var(--gold)}
.pq .q{font-family:'PFI';font-style:italic;font-size:1.25rem;line-height:1.3}
.pq .who{font-family:'AR';font-weight:700;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-top:.35rem}
.byline{font-family:'AR';font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:-.4rem 0 .8rem;text-align:center}
.byline.dir{margin:.7rem 0 0;line-height:1.7}

/* slate */
.slot{font-family:'AR';font-weight:700;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:1rem 0 .3rem;padding-bottom:.2rem;border-bottom:1px solid var(--rule)}
.g{display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;align-items:baseline;padding:.45rem 0;border-bottom:1px dotted var(--rule)}
details.g{display:block}
details.g summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;align-items:baseline}
details.g summary::-webkit-details-marker{display:none}
.g .m{font-family:'PF';font-weight:700;font-size:1.1rem;line-height:1.2}
.g .m .w{color:var(--teal)}.g .m .at{color:var(--soft);font-family:'LOI';font-style:italic;font-weight:400;font-size:.95rem}
.g .s{font-family:'AR';font-size:.72rem;color:var(--soft);white-space:nowrap;letter-spacing:.04em}
.g .s .tv{color:var(--ink);font-weight:700}
.g .s.fin{font-weight:700;color:var(--ink)}
.g .s.live{color:var(--red);font-weight:700}
.g .sp{grid-column:1/3;font-family:'AR';font-size:.7rem;color:var(--soft);letter-spacing:.02em}
.g .sp b{color:var(--ink);font-weight:700}
.g .sp .sealed{font-style:italic}
.g .who{padding:.3rem 0 .2rem;font-family:'AR';font-size:.68rem;line-height:1.55;letter-spacing:.02em}
.g .who .h{color:var(--teal);font-weight:600}.g .who .x{color:var(--red);font-weight:600}.g .who .side{color:var(--ink)}
.g .who .lab{color:var(--soft);font-weight:700;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;margin-right:.3rem}

/* season */
.seas td.money{font-family:'PF';font-weight:800;font-size:1.15rem;color:var(--teal)}

.empty{text-align:center;font-family:'PFI';font-style:italic;color:var(--soft);padding:.4rem 0 .2rem;font-size:1.05rem}

/* colophon */
.colo{margin-top:2rem;text-align:center;font-family:'AR';font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);line-height:2}
.sig{font-family:'PFI';font-style:italic;font-size:1.2rem;color:var(--ink);letter-spacing:0;text-transform:none}
/* calm pass (Oct 2): one accent, no competing colors */
.tabs a,.tabs a.go{color:var(--soft)}
.tabs a.on{color:var(--ink)}
.now .nk,.now .nk.final{color:var(--soft)}
.now .nn{background:none;border:0;border-top:1px solid var(--rule);border-radius:0;margin:.8rem 0 0;padding:.6rem 0 0;font-size:.82rem}
.now .nn .cd,.now .nl .cd{color:var(--ink)}
.now .fresh{font-size:.68rem;padding-top:.6rem;letter-spacing:.06em}
.now .fresh .dot{display:none}
.now .fresh{gap:0 .25rem}
.now .nk .lv{color:var(--red)}
.sec,.sec.t{color:var(--ink)}
.sec .o{display:none}
.hint{font-weight:600;color:var(--soft)}
.brow.lead .nm,.brow.lead .rk{color:var(--ink)}
.ruleref,.ruleref.sealed{color:inherit;text-decoration:underline dotted var(--rule);text-underline-offset:3px}
.slot{color:var(--soft)}
.g .m .w{color:var(--ink)}
.g .s.live{color:var(--red)}
.col p:first-of-type::first-letter{color:var(--ink)}
.tag.house{color:var(--soft);border-color:var(--rule)}
.mug .k{color:var(--soft)}
.more a,.pastwk a,.cal{color:var(--ink)}
details.g summary .s::after,.brow .rec::after{color:var(--soft)}
/* expert pass (Oct 2) */
.now .nn{border:0;margin:.5rem 0 0;padding:0;font-size:.78rem;background:none}
.now .nn a{color:var(--soft);text-decoration:underline dotted var(--rule);text-underline-offset:3px}
.now .cta{margin-top:1rem}
.now .cta[hidden]{display:none}
.fresh.bottom{justify-content:center;border:0;font-size:.62rem;padding:.2rem 0 0}
.brow summary{grid-template-columns:2rem 1fr auto auto;align-items:center;padding:.42rem 0}
.brow .nm{font-size:1.05rem}
.brow .rec{font-size:1.05rem;grid-column:4}
.brow .dots{grid-column:3;grid-row:1;max-width:8.6rem;margin:0 .2rem 0 0;gap:2px;justify-content:flex-end}
.brow .dots i{width:7px;height:7px}
.filed .nm2{white-space:nowrap}
details.tmore summary{list-style:none;cursor:pointer;font-family:'AR';font-weight:700;font-size:.75rem;letter-spacing:.06em;color:var(--soft);padding:.5rem 0}
details.tmore summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<div class="page">

  var ago=mins==null?"":(mins<1?"just now":mins<60?mins+" min ago":mins<120?"1 hr ago":Math.round(mins/60)+" hrs ago");
  var cls=mins==null?"":(mins<=70?"":mins<=180?"stale":"old");
  var nextTxt=D.status==="final"?"Week "+(D.week+1)+" slate Tuesday":"Updates hourly, 8 AM–11 PM ET";
  $("fresh").innerHTML='<span>Updated '+esc(fmtWhen(D.updated).replace(/^\w+ /,""))+(D.status==="final"?' · '+nextTxt:'')+'</span>';
})();

var played=D.games.filter(function(g){return g.winner&&g.winner!=="TIE";}).length;
var left=D.games.filter(function(g){return !g.winner;}).length;
var entrants=D.players.filter(function(p){return !p.house;}).length, pot=D.buyIn*entrants;
var ps=D.players.slice().sort(function(a,b){return (b.correct-a.correct)||(a.missed-b.missed)||a.name.localeCompare(b.name);});
var realPs=ps.filter(function(p){return !p.house;});
var top=realPs.length?realPs[0].correct:0;

var finals=D.games.filter(function(g){return g.winner;}).length;
var openN=D.games.filter(function(g){return !g.winner&&Date.parse(g.kickoff)>Date.now();}).length;
/* the old tiles are now one quiet line under the button: the hero already says the rest */
$("fresh").insertAdjacentHTML("afterbegin",'<span>'+entrants+' '+(entrants===1?"player":"players")+' · '+finals+' of '+D.games.length+' final ·&nbsp;</span>');
if(D.status==="final"){$("cta").textContent="Week "+(D.week+1)+" picks";}
if(D.status==="pre"){$("cta").textContent="Make your picks";}
if(D.status==="live"){$("cta").textContent="Make your picks";}
$("cta").hidden=(D.status!=="final"&&!openN&&!D.archive);

if(D.archive){$("cta").textContent="Back to this week’s board";$("cta").href="/pool/";$("cta").classList.add("quiet");$("fresh").textContent="Week "+D.week+" is in the books.";}

/* the hero: the one thing to know right now, then the next deadline with a live countdown */
(function(){
  var now=Date.now(), open=D.games.filter(function(g){return !g.winner&&Date.parse(g.kickoff)>now;});
  var inplay=D.games.filter(function(g){return !g.winner&&!g.liveFinal&&Date.parse(g.kickoff)<=now;});
  var L=top>0?realPs.filter(function(p){return p.correct===top;}):[];
  var leadTxt=!L.length?'':(L.length===1?'<b>'+esc(L[0].name)+'</b> leads at <b>'+L[0].correct+'–'+L[0].missed+'</b>':'<b>'+L.length+' tied</b> at the top, <b>'+top+'</b> right');
  var left=D.games.filter(function(g){return !g.winner;}).length;
  var k="", v="", sub="";
  if(D.status==="final"){
    var W=D.weekWinners||[];
    k=W.length>1?'Week '+D.week+' · split':'Week '+D.week+' champion';
    v=W.length?esc(W.join(" & ")):'Final';
    var wp=realPs.filter(function(p){return W.indexOf(p.name)>=0;})[0];
    sub=(wp?'<b>'+wp.correct+'–'+wp.missed+'</b>'+(D.tbUsed?' · won on the tiebreaker':''):'')+(D.archive?'':' · picks next week’s mugshot');
    $("nowK").classList.add("final");
  } else if(inplay.length===1){
    var g=inplay[0], parts=(g.live||"").split(" · ");
    k='<span class="lv">●</span> On now'+(g.tv?' · '+esc(g.tv):'');
    v=g.live?'<span class="sc">'+esc(parts[0])+'</span>':esc(g.away)+' <span style="font-weight:400;font-style:italic">at</span> '+esc(g.home);
    sub=(g.live&&parts[1]?esc(parts.slice(1).join(" · "))+(g.liveAt?' · as of '+esc(fmtWhen(g.liveAt).replace(/^\w+ /,"")):'')+'<br>':'')+(leadTxt||'');
  } else if(inplay.length>1){
    k='<span class="lv">●</span> On now';
    v=inplay.length+' games live';
    sub=leadTxt?leadTxt+' · <b>'+left+'</b> to go':'<b>'+left+'</b> games to go';
  } else if(L.length){
    k='Leading Week '+D.week;
    v=L.length===1?esc(L[0].name):L.length+'-way tie';
    sub=(L.length===1?'<b>'+L[0].correct+'–'+L[0].missed+'</b>':'at <b>'+top+'</b> right')+' · <b>'+left+'</b> game'+(left===1?'':'s')+' to go';
  } else if(open.length){
    k='Picks lock in';
    v='<span class="cd" data-until="'+esc(open[0].kickoff)+'"></span>';
    sub=esc(open[0].away)+' at '+esc(open[0].home)+' · '+esc(fmtWhen(open[0].kickoff))+' · <b>'+entrants+'</b> in so far';
  } else { k='Week '+D.week; v='All games kicked off'; sub=leadTxt; }
  $("nowK").innerHTML=k; $("nowL").innerHTML=v; $("nowS").innerHTML=sub;
  /* next deadline, unless the hero already is the countdown */
  var nn=$("nowN");
  if(open.length&&!D.archive&&D.status!=="final"){
    var g2=open[0];
    nn.innerHTML=k==="Picks lock in"?'<a href="/pool/week.ics">Add the deadline to your calendar</a>':'Next lock '+esc(fmtWhen(g2.kickoff))+' · <span class="cd" data-until="'+esc(g2.kickoff)+'"></span> · <a href="/pool/week.ics">add to calendar</a>';
    nn.hidden=false;
  } else nn.hidden=true;
  tick();
})();

/* back from the form: Tally sends people here with ?filed */
(function(){
  var q=location.search;
  if(!/[?&]filed\b/.test(q)) return;
  $("ack").innerHTML='<div class="ack"><div class="k">Sheet received</div><div class="n">You’re in for Week '+D.week+'.</div><div class="d">Your picks stay sealed until each game kicks off. Changed your mind? <a href="'+esc(D.formUrl)+'">Submit again</a>; your latest sheet before each kickoff counts. The board picks up new sheets on the hour.</div></div>';
  try{ history.replaceState(null,"",location.pathname+location.hash); }catch(e){}
})();

var h="";

/* the mugshot: the previous winner's pick of one loser's face */
if(D.face&&D.face.photo){
  var F=D.face;
  $("mug").innerHTML='<div class="mug"><img src="'+esc(F.photo)+'" alt=""><div><div class="k"><a class="ruleref" style="color:inherit" href="/pool/about/#mugshot">The Mugshot</a> · Week '+D.week+'</div><div class="n">'+esc(F.who)+'</div><div class="d">Hung here by <b>'+esc(F.by)+'</b>, who won Week '+esc(F.week||(D.week-1))+'.'+(F.line?' '+esc(F.line):'')+'</div></div></div>';
}

var secs={};
var decidedN=D.games.filter(function(g){return g.winner;}).length;
/* board */
h+='<a id="board"></a>'+orn(decidedN||D.status==="final"?"Standings":"Who’s In");
var sealedN=D.games.filter(function(g){return g.status==="sealed";}).length;
if(!ps.length){
  h+='<div class="empty">Nobody has filed yet. The board fills in as sheets come in.</div>';
} else if(!decidedN&&D.status!=="final"){
  h+='<div class="hint">'+realPs.length+' in · picks stay <a class="ruleref" href="/pool/about/#sealed">sealed until kickoff</a></div>';
  h+='<p class="filed" style="text-align:center">'+(realPs.length?realPs.map(function(p){return '<span class="nm2">'+esc(p.name)+'</span>';}).join(" · "):'Nobody yet.')+'</p>';
} else {
  var dots=function(p){var o='';D.games.forEach(function(g,i){if(g.status==="sealed")return;var pk=p.sheet?p.sheet[String(i)]:null;
      o+='<i class="'+(!pk?'':!g.winner?'p':g.winner==="TIE"?'':(pk===g.winner?'ok':'no'))+'" title="'+esc(g.away)+' at '+esc(g.home)+'"></i>';});return o?'<span class="dots">'+o+'</span>':'';};
  var W=(D.status==="final"&&D.weekWinners)||[], isW=function(p){return W.indexOf(p.name)>=0;};
  var beats=function(q,p){return q.correct>p.correct||(q.correct===p.correct&&(q.missed<p.missed||(q.missed===p.missed&&isW(q)&&!isW(p))));};
  var dispRank=function(p){return 1+realPs.filter(function(q){return beats(q,p);}).length;};
  h+='<div class="hint">Tap a name for their picks</div>';
  ps.forEach(function(p){
    var lead=!p.house&&p.correct>0&&dispRank(p)===1;
    var mv=p.delta>0?'<span class="mv up">▲'+p.delta+'</span>':(p.delta<0?'<span class="mv dn">▼'+(-p.delta)+'</span>':'');
    var tag=p.house?'<span class="tag house">House</span>':D.status==="final"?'':(p.state==="clinched"?'<span class="tag clinched">Clinched</span>':(p.state==="out"?'<span class="tag out">Out</span>':''));
    h+='<details class="brow'+(lead?' lead':'')+(p.house?' house':'')+'"><summary><span class="rk">'+(p.house?'–':(realPs.filter(function(q){return q!==p&&!beats(q,p)&&!beats(p,q);}).length?'T':'')+dispRank(p))+'</span>'+
       '<span class="nm">'+esc(p.name)+mv+tag+badgeIcons(p)+'</span><span class="rec">'+p.correct+'–'+p.missed+'</span>'+dots(p)+'</summary><div class="sheet">';
    var earned=badgesFor(p);
    if(earned.length){
      h+='<div class="earned">'+earned.map(function(b){return '<span class="bd '+esc(b.id)+'">'+BADGE[b.id].i+'</span><a href="/pool/about/#b-'+esc(b.id)+'">'+esc(BADGE[b.id].l)+'</a>'+(b.note?' — '+esc(b.note):'');}).join('<br>')+'</div>';
    }
    var lines=[];
    D.games.forEach(function(g,i){
      if(g.status==="sealed") return;
      var pk=p.sheet?p.sheet[String(i)]:undefined;
      if(pk===null||pk===undefined) lines.push('<span class="no">'+esc(g.away)+'@'+esc(g.home)+' no pick</span>');
      else if(!g.winner) lines.push('<span class="pend">'+esc(pk)+'</span>');
      else if(g.winner==="TIE") lines.push(esc(pk)+' (tie)');
      else lines.push('<span class="'+(pk===g.winner?'ok':'no')+'">'+esc(pk)+'</span>');
    });
    h+=lines.join(' · ')+(sealedN?' · <span class="sealed">'+sealedN+' sealed</span>':'');
    var hm=D.homer&&D.homer[p.name];
    if(hm&&(hm.bills[0]+hm.bills[1]+hm.jets[0]+hm.jets[1])>0) h+='<br>Season on Bills games '+hm.bills[0]+'–'+hm.bills[1]+' · Jets games '+hm.jets[0]+'–'+hm.jets[1];
    if(p.tb!=null&&D.games[D.games.length-1].status!=="sealed") h+='<br><a class="ruleref" href="/pool/about/#tiebreak">Tiebreaker</a> '+p.tb;

    h+='</div></details>';
  });
}


secs.board=h; h="";
/* slate */
h+='<a id="slate"></a>'+orn("This Week’s Games",true);
h+='<div class="hint">All times Eastern'+(D.games.some(function(g){return g.status!=="sealed"&&g.sides;})?' · tap a started game for who picked whom':'')+'</div>';
var lastSlot="";
D.games.forEach(function(g,i){
  var slot=(g.when||"").replace(/\s+\d{1,2}:\d{2}\s*[AP]M.*$/,"").replace(/^(Sun|Mon|Thu|Sat)\b/,function(m){return {Sun:"Sunday",Mon:"Monday",Thu:"Thursday",Sat:"Saturday"}[m];});
  var time=(g.when||"").replace(/^\w{3}\s+/,"").replace(/\s*·\s*/g," ");
  if(slot!==lastSlot){h+='<div class="slot">'+esc(slot)+'</div>';lastSlot=slot;}
  var gs=D.stats&&D.stats.games&&D.stats.games[String(i)];
  var m,s,sp="",who="";
  if(g.winner==="TIE"){m=esc(g.away)+' <span class="at">at</span> '+esc(g.home);s='<span class="s fin">Tie · nobody</span>';}
  else if(g.winner){var aw=g.winner===g.away;
    m='<span class="'+(aw?'w':'')+'">'+esc(g.away)+'</span> <span class="at">at</span> <span class="'+(aw?'':'w')+'">'+esc(g.home)+'</span>';
    s='<span class="s fin">'+esc(g.score||"Final")+'</span>';}
  else if(g.liveFinal){m=esc(g.away)+' <span class="at">at</span> '+esc(g.home);s='<span class="s fin">'+esc(g.liveFinal)+'</span>';}
  else if(g.status==="live"){m=esc(g.away)+' <span class="at">at</span> '+esc(g.home);s='<span class="s live">'+(g.live?esc(g.live):'Live')+'</span>';}
  else {m=esc(g.away)+' <span class="at">at</span> '+esc(g.home);s='<span class="s">'+esc(time)+(g.tv?' · <b class="tv">'+esc(g.tv)+'</b>':'')+'</span>';}
  if(g.status!=="sealed"&&g.sides){
    var notHouse=function(n){return !ps.some(function(p){return p.house&&p.name===n;});};
    var A=(g.sides[g.away]||[]).filter(notHouse),H=(g.sides[g.home]||[]).filter(notHouse);
    var na=gs?gs.away:A.length, nh=gs?gs.home:H.length;
    sp='<span class="sp"><b>'+na+'</b> picked '+esc(g.away)+' · <b>'+nh+'</b> '+esc(g.home)+(gs&&gs.upset&&na!==nh?' · <b style="color:var(--red)">upset</b>':'')+'</span>';
    if(g.winner&&g.winner!=="TIE"){
      who='<div class="who">'+(g.hits.filter(notHouse).length?'<span class="lab">Right</span><span class="h">'+esc(g.hits.filter(notHouse).join(", "))+'</span><br>':'')+(g.misses.filter(notHouse).length?'<span class="lab">Wrong</span><span class="x">'+esc(g.misses.filter(notHouse).join(", "))+'</span>':'')+'</div>';
    } else {
      who='<div class="who"><span class="lab">'+esc(g.away)+'</span><span class="side">'+(A.length?esc(A.join(", ")):"—")+'</span><br><span class="lab">'+esc(g.home)+'</span><span class="side">'+(H.length?esc(H.join(", ")):"—")+'</span></div>';
    }
    h+='<details class="g"><summary><div class="m">'+m+'</div>'+s+sp+'</summary>'+who+'</details>';
  } else {
    h+='<div class="g"><div class="m">'+m+'</div>'+s+'</div>';
  }
});

secs.games=h; h="";
/* column */
if(D.column){
  h+='<a id="column"></a>'+orn("The Column")+'<div class="col">';
  D.column.split(/\n\n+/).slice(0,2).forEach(function(p){h+='<p>'+esc(p)+'</p>';});
  h+='</div>';
}
secs.column=h; h="";
/* trash talk: the three newest up front, the rest one tap away */
if(D.trash.length){
  var TT=D.trash.slice().reverse(), li=function(t){return '<li>“'+esc(t.text)+'”<b>'+esc(t.from)+'</b></li>';};
  h+=orn("Trash Talk")+'<ul class="tt">'+TT.slice(0,3).map(li).join('')+'</ul>';
  if(TT.length>3) h+='<details class="tmore"><summary>All '+TT.length+' ›</summary><ul class="tt">'+TT.slice(3).map(li).join('')+'</ul></details>';
}
secs.trash=h; h="";

/* by the numbers */
if(D.status!=="pre"&&D.stats&&D.stats.decided>0){
  var S=D.stats, G=D.games;
  h+=orn("By the Numbers",true)+'<div class="num">';
  h+='<div class="it"><div class="k">Upset rate</div><div class="v">'+S.upsets+' of '+S.decided+'</div><div class="d">Games where the smaller side of the room was right.</div></div>';
  if(S.best&&S.best.who&&(S.best.who.length<=2||S.best.who.length*3<realPs.length)){var bg=G[S.best.game];h+='<div class="it"><div class="k">Best pick</div><div class="v">'+esc(bg.winner)+'</div><div class="d">'+esc(bg.away)+' at '+esc(bg.home)+'. Only <b>'+esc(S.best.who.join(", "))+'</b> had it.</div></div>';}
  if(S.worst&&S.worst.n===0){var wg=G[S.worst.game];h+='<div class="it"><div class="k">Nobody had</div><div class="v">'+esc(wg.winner)+'</div><div class="d">'+esc(wg.away)+' at '+esc(wg.home)+'. The whole room, wrong.</div></div>';}
  var hp=ps.filter(function(p){return p.house;})[0];
  if(hp){var beat=realPs.filter(function(p){return p.correct<hp.correct;}).length;h+='<div class="it"><div class="k">'+esc(hp.name)+', the coin</div><div class="v">'+hp.correct+'–'+hp.missed+'</div><div class="d">'+(beat?'Ahead of <b>'+beat+'</b> of you.':(realPs.every(function(p){return p.correct>hp.correct;})?'Behind everyone. For now.':'Ahead of nobody yet.'))+'</div></div>';}
  h+='</div>';
}

/* season */
if(D.season_table.length){
h+=orn("The Season",true);
  var ss=D.season_table.slice().sort(function(a,b){return (b.won-a.won)||(b.correct-a.correct)||a.name.localeCompare(b.name);});
  h+='<table class="stand seas"><thead><tr><th>Player</th><th>Right</th><th>Wrong</th><th>Weeks won</th>'+(D.buyIn?'<th>Won</th>':'')+'</tr></thead><tbody>';
  ss.forEach(function(p,i){h+='<tr><td class="nm"><span class="rk">'+(i+1)+'</span>'+esc(p.name)+'</td><td>'+p.correct+'</td><td>'+p.missed+'</td><td>'+(p.weeksWon||"—")+'</td>'+(D.buyIn?'<td class="money">'+(p.won?money(p.won):"—")+'</td>':'')+'</tr>';});
  h+='</tbody></table>';
}

/* past weeks */
if(D.pastWeeks&&D.pastWeeks.length){
  h+=orn("Past Weeks")+'<div class="pastwk">'+D.pastWeeks.map(function(w){return '<a href="/pool/weeks/'+w.week+'/">Week '+w.week+(w.winners&&w.winners.length?' · '+esc(w.winners.join(" & ")):'')+'</a>';}).join('<br>')+'</div>';
}
/* how it works */
h+='<div class="more"><a href="/pool/about/">How it works</a><br>The rules, what the badges mean, and who Claude is.</div>';

var order=(decidedN||D.status==="final")?[secs.board,secs.trash,secs.games,secs.column]:[secs.games,secs.column,secs.trash,secs.board];
$("root").innerHTML=order.join("")+h;
}
render();

/* phones cache this page hard; pull the live data past the cache and re-render if it is newer */
function refresh(){
  if(!window.fetch) return;
  fetch("/pool/data/page.json?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(N){
    if(N&&N.updated&&Date.parse(N.updated)>Date.parse(D.updated||0)){D=N;render();}
  }).catch(function(){});
}
if(!D.archive){
refresh();
document.addEventListener("visibilitychange",function(){if(!document.hidden) refresh();});
setInterval(refresh,10*60*1000);
pollLive();
setInterval(pollLive,60*1000);
document.addEventListener("visibilitychange",function(){if(!document.hidden) pollLive();});
}
})();
</script>
</body>
</html>
