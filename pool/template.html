<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Sunday Tax</title>
<style>
@font-face{font-family:'PF';src:url(/assets/fonts/PlayfairDisplay.ttf);font-weight:100 900;font-display:swap}
@font-face{font-family:'PFI';src:url(/assets/fonts/PlayfairDisplay-Italic.ttf);font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:'LO';src:url(/assets/fonts/Lora.ttf);font-weight:100 900;font-display:swap}
@font-face{font-family:'LOI';src:url(/assets/fonts/Lora-Italic.ttf);font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:'AR';src:url(/assets/fonts/Archivo.ttf);font-weight:100 900;font-display:swap}
:root{--paper:#fbf5e4;--ink:#1c170f;--red:#c8302f;--teal:#0e8a8a;--gold:#e8b100;--soft:#5f5238;--rule:#d6cbaf;--wash:#f3ead2}
*{box-sizing:border-box}
html{background:#ece4d1}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'LO',Georgia,serif;font-size:1.1rem;line-height:1.5;font-weight:480;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
.page{max-width:44rem;margin:0 auto;padding:1.1rem 1.1rem 2.4rem}
a{color:inherit}

/* masthead */
.kicker{display:flex;justify-content:space-between;gap:1rem;font-family:'AR';font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:600;margin-bottom:.4rem}
.dbl .a{height:3px;background:var(--ink)}.dbl .b{height:1px;background:var(--ink);margin-top:3px}
.dbl{margin:.5rem 0 .9rem}.dbl.tight{margin:.7rem 0 .6rem}
h1{margin:.6rem 0 0;text-align:center;font-family:'PF';font-weight:800;font-size:clamp(2.5rem,12vw,4.2rem);line-height:.95;letter-spacing:-.01em}
.tag{text-align:center;font-family:'PFI';font-style:italic;font-size:1.05rem;color:var(--soft);margin-top:.35rem}
.orn{text-align:center;color:var(--gold);font-size:1rem;letter-spacing:.9em;margin:.5rem 0 .4rem}
.dateline{text-align:center;font-family:'AR';font-weight:800;font-size:.95rem;letter-spacing:.14em;text-transform:uppercase}
.dateline .st{color:var(--red)}.dateline .st.final{color:var(--teal)}
.stamp{text-align:center;font-family:'AR';font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:.25rem}

/* tiles */
.tiles{display:flex;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.tile{flex:1;text-align:center;padding:.6rem .2rem;border-right:1px solid var(--rule);min-width:0}
.tile:last-child{border-right:0}
.tile .v{font-family:'PF';font-weight:800;font-size:clamp(1.4rem,6.5vw,2.3rem);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v.red{color:var(--red)}
.tile .k{font-family:'AR';font-weight:700;font-size:.55rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-top:.2rem}

/* cta */
.cta{display:block;margin:1rem 0 0;text-align:center;background:var(--red);color:#fff;text-decoration:none;font-family:'AR';font-weight:800;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;padding:.85rem;border-radius:3px}
.cta.quiet{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.cta:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

/* sections */
.sec{text-align:center;font-family:'AR';font-weight:800;font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;margin:1.9rem 0 .9rem;padding-top:1.1rem;border-top:1px solid var(--rule);color:var(--red)}
.sec.t{color:var(--teal)}
.sec .o{color:var(--gold);margin:0 .7rem;letter-spacing:0}
.lede{font-family:'PFI';font-style:italic;text-align:center;color:var(--soft);margin:-.4rem 0 .9rem;font-size:1rem}

/* board */
.brow{border-bottom:1px solid var(--rule)}
.brow summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1.6rem 1fr auto auto auto;gap:0 .6rem;align-items:baseline;padding:.55rem 0}
.brow summary::-webkit-details-marker{display:none}
.brow .rk{font-family:'AR';font-weight:700;font-size:.75rem;color:var(--soft)}
.brow .nm{font-family:'PF';font-weight:700;font-size:1.15rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .nm .mv{font-family:'AR';font-size:.7rem;font-weight:700;margin-left:.35rem;vertical-align:.1em}
.brow .nm .mv.up{color:var(--teal)}.brow .nm .mv.dn{color:var(--red)}
.brow .rec{font-family:'PF';font-weight:800;font-size:1.15rem;text-align:right}
.brow .lf,.brow .mx{font-family:'AR';font-size:.72rem;color:var(--soft);text-align:right;white-space:nowrap}
.brow .lf b,.brow .mx b{color:var(--ink);font-weight:700;font-size:.9rem}
.brow.lead .nm,.brow.lead .rk{color:var(--red)}
.brow .tag{display:inline-block;font-family:'AR';font-weight:700;font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;padding:.05rem .4rem;border:1px solid;border-radius:2px;margin-left:.4rem;vertical-align:.15em}
.tag.clinched{color:var(--teal);border-color:var(--teal)}.tag.out{color:var(--soft);border-color:var(--rule)}
.sheet{padding:.2rem 0 .7rem 2.2rem;font-family:'AR';font-size:.75rem;line-height:1.7;color:var(--soft)}
.sheet .ok{color:var(--teal);font-weight:600}.sheet .no{color:var(--red);font-weight:600;text-decoration:line-through}
.sheet .pend{color:var(--ink)}.sheet .sealed{font-style:italic}
.bhead{display:grid;grid-template-columns:1.6rem 1fr auto auto auto;gap:0 .6rem;font-family:'AR';font-weight:700;font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);padding:.3rem 0;border-bottom:2px solid var(--ink)}
.bhead span:nth-child(n+3){text-align:right}
.tick{border-left:3px solid var(--teal);padding:.1rem 0 .1rem .8rem;margin:.5rem 0}
.tick .at{font-family:'AR';font-weight:700;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.tick .n{font-size:1rem}
.dec{padding:.5rem 0;border-bottom:1px dotted var(--rule)}
.dec .m{font-family:'PF';font-weight:700;font-size:1.05rem}
.dec .m .at{color:var(--soft);font-family:'LOI';font-style:italic;font-weight:400;font-size:.9rem}
.dec .who{font-family:'AR';font-size:.72rem;line-height:1.6}.dec .who b{font-weight:700;color:var(--ink)}
.g .s.live{color:var(--red);font-weight:700}.g .n .side{color:var(--ink)}
.g .n .sealed{font-style:italic;color:var(--soft)}

/* standings */
table{width:100%;border-collapse:collapse}
.stand th{font-family:'AR';font-weight:700;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);text-align:right;padding:.3rem .25rem;border-bottom:2px solid var(--ink)}
.stand th:first-child,.stand td:first-child{text-align:left;padding-left:0}
.stand th:last-child,.stand td:last-child{padding-right:0}
.stand td{padding:.5rem .25rem;border-bottom:1px solid var(--rule);text-align:right;font-size:1.05rem}
.stand td.nm{font-family:'PF';font-weight:700;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0;width:52%}
.stand td.nm .rk{display:inline-block;width:1.5rem;font-family:'AR';font-weight:700;font-size:.75rem;color:var(--soft)}
.stand tr.lead td.nm{color:var(--red)}
.stand tr.lead td.nm .rk{color:var(--red)}
.stand td.rec{font-family:'PF';font-weight:800;font-size:1.15rem}
.stand td.tb{color:var(--soft);font-size:.95rem}
.filed{font-size:1rem;color:var(--soft)}
.filed b{color:var(--ink);font-weight:600}

/* column */
.col p{margin:0 0 .85rem;font-size:1.1rem}
.col p:first-of-type::first-letter{font-family:'PF';font-weight:800;font-size:3.1rem;line-height:.8;float:left;padding:.28rem .45rem 0 0;color:var(--red)}
.pq{margin:1rem 0 1rem;padding:.6rem 0 .6rem 1rem;border-left:3px solid var(--gold)}
.pq .q{font-family:'PFI';font-style:italic;font-size:1.25rem;line-height:1.3}
.pq .who{font-family:'AR';font-weight:700;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-top:.35rem}
.byline{font-family:'AR';font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:-.4rem 0 .8rem;text-align:center}

/* slate */
.slot{font-family:'AR';font-weight:700;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:1rem 0 .3rem;padding-bottom:.2rem;border-bottom:1px solid var(--rule)}
.slot:first-child{margin-top:0}
.g{display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;align-items:baseline;padding:.45rem 0;border-bottom:1px dotted var(--rule)}
.g .m{font-family:'PF';font-weight:700;font-size:1.1rem;line-height:1.2}
.g .m .w{color:var(--teal)}.g .m .at{color:var(--soft);font-family:'LOI';font-style:italic;font-weight:400;font-size:.95rem}
.g .s{font-family:'AR';font-size:.72rem;color:var(--soft);white-space:nowrap;letter-spacing:.04em}
.g .s.fin{font-weight:700;color:var(--ink)}
.g .n{grid-column:1/3;font-family:'AR';font-size:.68rem;line-height:1.55;letter-spacing:.02em}
.g .n .h{color:var(--teal);font-weight:600}.g .n .x{color:var(--red);font-weight:600}
.g .n .lab{color:var(--soft);font-weight:700;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;margin-right:.3rem}

/* season */
.seas td.money{font-family:'PF';font-weight:800;font-size:1.15rem;color:var(--teal)}

.empty{text-align:center;font-family:'PFI';font-style:italic;color:var(--soft);padding:.4rem 0 .2rem;font-size:1.05rem}
.rules{font-size:.95rem;color:var(--soft);line-height:1.55}
.rules b{color:var(--ink);font-weight:600}

/* colophon */
.colo{margin-top:2rem;text-align:center;font-family:'AR';font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);line-height:2}
.sig{font-family:'PFI';font-style:italic;font-size:1.2rem;color:var(--ink);letter-spacing:0;text-transform:none}
</style>
</head>
<body>
<div class="page">
  <div class="kicker"><span>The Family Football Pool</span><span id="kickR"></span></div>
  <div class="dbl"><div class="a"></div><div class="b"></div></div>
  <h1 id="poolName">The Sunday Tax</h1>
  <div class="tag" id="tag"></div>
  <div class="orn">❧ ❦ ❧</div>
  <div class="dateline" id="dateline"></div>
  <div class="stamp" id="stamp"></div>
  <div class="dbl tight"><div class="a"></div><div class="b"></div></div>

  <div class="tiles" id="tiles"></div>
  <a class="cta" id="cta" href="#">Make your picks</a>

  <div id="root"></div>

  <div class="colo">
    <span class="sig">— G.</span><br>
    Scores and picks kept by Claude on a schedule
  </div>
</div>

<script id="data" type="application/json">
/*DATA*/
</script>

<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById("data").textContent);
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function money(n){return "$"+(Math.round(n*100)/100).toString().replace(/\.00$/,"");}
function fmtWhen(iso){try{return new Date(iso).toLocaleString(undefined,{weekday:"short",hour:"numeric",minute:"2-digit"});}catch(e){return "";}}
function orn(t,teal){return '<div class="sec'+(teal?' t':'')+'"><span class="o">❦</span>'+t+'<span class="o">❦</span></div>';}

document.title=D.name; $("poolName").textContent=D.name;
$("cta").href=D.formUrl;
$("kickR").textContent=D.season+" · Week "+D.week;
$("tag").textContent=D.buyIn?"The Football Pool · Straight up, $"+D.buyIn+" a week, winner takes the pot":"The Football Pool · Straight up, free to play, bragging rights on the line";
var stTxt={pre:"Picks are open",live:"Games under way",final:"Final"}[D.status]||"";
$("dateline").innerHTML='Week '+D.week+' &middot; <span class="st '+esc(D.status)+'">'+esc(stTxt)+'</span>';
var nxt=D.status==="final"?"Next slate Tuesday":(D.status==="pre"?"Updates hourly once games start":"Updates hourly during games · final after Monday night");
$("stamp").textContent="Updated "+fmtWhen(D.updated)+" · "+nxt;

var played=D.games.filter(function(g){return g.winner&&g.winner!=="TIE";}).length;
var left=D.games.filter(function(g){return !g.winner;}).length;
var entrants=D.players.length, pot=D.buyIn*entrants;
var ps=D.players.slice().sort(function(a,b){return (b.correct-a.correct)||(a.missed-b.missed)||a.name.localeCompare(b.name);});
var top=ps.length?ps[0].correct:0;

/* tiles */
var t3;
if(D.status==="final"&&D.weekWinners.length) t3=D.weekWinners.length>1?{v:"Split "+D.weekWinners.length+" ways",k:"this week",red:true}:{v:esc(D.weekWinners[0]),k:"takes the week",red:true};
else if(D.status==="live"&&ps.length&&top>0){var leaders=ps.filter(function(p){return p.correct===top;});
  t3=leaders.length>1?{v:leaders.length+"-way tie",k:"at "+top+" right",red:true}:{v:esc(leaders[0].name),k:"leading, "+top+" right",red:true};}
else {var first=D.games[0];t3={v:esc((first.when||"").replace(/ · .*$/,"")),k:"first kickoff"};}
$("tiles").innerHTML=
 (D.buyIn
   ? '<div class="tile"><div class="v red">'+money(D.status==="final"?D.weekPayout:pot)+'</div><div class="k">'+(D.status==="final"?"paid out":"in the pot")+'</div></div>'
   : '<div class="tile"><div class="v red">Free</div><div class="k">to play, for now</div></div>')+
 '<div class="tile"><div class="v">'+entrants+'</div><div class="k">'+(entrants===1?"entry":"entries")+(D.status==="pre"?" so far":"")+'</div></div>'+
 '<div class="tile"><div class="v'+(t3.red?' red':'')+'">'+t3.v+'</div><div class="k">'+t3.k+'</div></div>';
if(D.status==="final"){$("cta").textContent="Week "+(D.week+1)+" picks";}
if(D.status==="live"){$("cta").classList.add("quiet");$("cta").textContent="Late sheet? Remaining games count";}

var h="";

/* board */
h+=orn("The Board");
var sealedN=D.games.filter(function(g){return g.status==="sealed";}).length;
if(!ps.length){
  h+='<div class="empty">Nobody has filed yet. The board fills in as sheets come in.</div>';
} else if(D.status==="pre"){
  h+='<div class="lede">Sheets in the drawer, sealed until kickoff.</div>';
  h+='<p class="filed"><b>Filed:</b> '+ps.map(function(p){return esc(p.name);}).join(", ")+'.</p>';
  h+='<p class="filed">Changed your mind? Submit the form again. Your latest sheet before each kickoff is the one that counts. Once games start, tap your name here to see your picks.</p>';
} else {
  h+='<div class="bhead"><span>#</span><span>Player</span><span>Rec</span><span>Left</span><span>Max</span></div>';
  ps.forEach(function(p){
    var lead=p.rank===1&&p.correct>0;
    var mv=p.delta>0?'<span class="mv up">▲'+p.delta+'</span>':(p.delta<0?'<span class="mv dn">▼'+(-p.delta)+'</span>':'');
    var tag=p.state==="clinched"?'<span class="tag clinched">Clinched</span>':(p.state==="out"?'<span class="tag out">Out</span>':'');
    h+='<details class="brow'+(lead?' lead':'')+'"><summary><span class="rk">'+p.rank+'</span>'+
       '<span class="nm">'+esc(p.name)+mv+tag+'</span><span class="rec">'+p.correct+'–'+p.missed+'</span>'+
       '<span class="lf"><b>'+p.remaining+'</b></span><span class="mx"><b>'+p.max+'</b></span></summary><div class="sheet">';
    var lines=[];
    D.games.forEach(function(g,i){
      if(g.status==="sealed") return;
      var pk=p.sheet?p.sheet[String(i)]:undefined;
      if(pk===null||pk===undefined) lines.push('<span class="no">'+esc(g.away)+'@'+esc(g.home)+' no pick</span>');
      else if(!g.winner) lines.push('<span class="pend">'+esc(pk)+'</span>');
      else if(g.winner==="TIE") lines.push(esc(pk)+' (tie)');
      else lines.push('<span class="'+(pk===g.winner?'ok':'no')+'">'+esc(pk)+'</span>');
    });
    h+=lines.join(' · ')+(sealedN?' · <span class="sealed">'+sealedN+' sealed</span>':'');
    if(p.tb!=null&&D.games[D.games.length-1].status!=="sealed") h+='<br>Tiebreaker '+p.tb;
    h+='</div></details>';
  });
}

/* what decides it */
if(D.status==="live"&&D.decides&&D.decides.length){
  h+=orn("What Decides It",true)+'<div class="lede">Games still open where the contenders split.</div>';
  D.decides.forEach(function(d){
    var g=D.games[d.game];
    h+='<div class="dec"><div class="m">'+esc(g.away)+' <span class="at">at</span> '+esc(g.home)+' <span class="at">· '+esc(g.status==="live"?"in progress":g.when)+'</span></div>'+
       '<div class="who"><b>'+esc(g.away)+':</b> '+esc(d.away.join(", "))+' &nbsp;·&nbsp; <b>'+esc(g.home)+':</b> '+esc(d.home.join(", "))+'</div></div>';
  });
}

/* ticker */
if(D.updates&&D.updates.length){
  h+=orn("The Ticker");
  D.updates.slice().reverse().slice(0,6).forEach(function(u){
    h+='<div class="tick"><div class="at">'+esc(fmtWhen(u.at))+'</div><div class="n">'+esc(u.note)+'</div></div>';
  });
}

/* column */
if(D.column||D.trash.length){
  h+=orn("The Column",true)+'<div class="byline">From the commissioner’s desk · grudges printed as received</div><div class="col">';
  if(D.column) D.column.split(/\n\n+/).forEach(function(p){h+='<p>'+esc(p)+'</p>';});
  D.trash.forEach(function(t){h+='<div class="pq"><div class="q">“'+esc(t.text)+'”</div><div class="who">'+esc(t.from)+'</div></div>';});
  h+='</div>';
}

/* slate */
h+=orn("The Slate");
var lastSlot="";
D.games.forEach(function(g){
  var slot=(g.when||"").replace(/\s+\d{1,2}:\d{2}\s*[AP]M.*$/,"").replace(/^(Sun|Mon|Thu|Sat)\b/,function(m){return {Sun:"Sunday",Mon:"Monday",Thu:"Thursday",Sat:"Saturday"}[m];});
  var time=(g.when||"").replace(/^\w{3}\s+/,"");
  if(slot!==lastSlot){h+='<div class="slot">'+esc(slot)+'</div>';lastSlot=slot;}
  var m, s;
  if(g.winner==="TIE"){m=esc(g.away)+' <span class="at">at</span> '+esc(g.home);s='<span class="s fin">Tie · nobody</span>';}
  else if(g.winner){var aw=g.winner===g.away;
    m='<span class="'+(aw?'w':'')+'">'+esc(g.away)+'</span> <span class="at">at</span> <span class="'+(aw?'':'w')+'">'+esc(g.home)+'</span>';
    s='<span class="s fin">'+esc(g.score||"Final")+'</span>';}
  else if(g.status==="live"){m=esc(g.away)+' <span class="at">at</span> '+esc(g.home);s='<span class="s live">In progress</span>';}
  else {m=esc(g.away)+' <span class="at">at</span> '+esc(g.home);s='<span class="s">'+esc(time)+'</span>';}
  h+='<div class="g"><div class="m">'+m+'</div>'+s;
  if(g.status==="sealed"&&D.status!=="pre"&&ps.length) h+='<div class="n"><span class="lab">Picks</span><span class="sealed">sealed until kickoff</span></div>';
  if(g.status==="live"&&g.sides){
    var A=g.sides[g.away]||[],H=g.sides[g.home]||[];
    h+='<div class="n"><span class="lab">'+esc(g.away)+'</span><span class="side">'+(A.length?esc(A.join(", ")):"—")+'</span><br><span class="lab">'+esc(g.home)+'</span><span class="side">'+(H.length?esc(H.join(", ")):"—")+'</span></div>';
  }
  if((g.hits&&g.hits.length)||(g.misses&&g.misses.length)){
    h+='<div class="n">';
    if(g.hits&&g.hits.length) h+='<span class="lab">Right</span><span class="h">'+esc(g.hits.join(", "))+'</span>';
    if(g.misses&&g.misses.length) h+=(g.hits&&g.hits.length?'<br>':'')+'<span class="lab">Wrong</span><span class="x">'+esc(g.misses.join(", "))+'</span>';
    h+='</div>';
  }
  h+='</div>';
});

/* season */
h+=orn("The Season",true);
if(D.season_table.length){
  var ss=D.season_table.slice().sort(function(a,b){return (b.won-a.won)||(b.correct-a.correct)||a.name.localeCompare(b.name);});
  h+='<table class="stand seas"><thead><tr><th>Player</th><th>W</th><th>L</th><th>Weeks</th>'+(D.buyIn?'<th>Won</th>':'')+'</tr></thead><tbody>';
  ss.forEach(function(p,i){h+='<tr><td class="nm"><span class="rk">'+(i+1)+'</span>'+esc(p.name)+'</td><td>'+p.correct+'</td><td>'+p.missed+'</td><td>'+(p.weeksWon||"—")+'</td>'+(D.buyIn?'<td class="money">'+(p.won?money(p.won):"—")+'</td>':'')+'</tr>';});
  h+='</tbody></table>';
} else {
  h+='<div class="empty">No weeks in the books. The ledger opens after Week '+D.week+'.</div>';
}

/* rules */
h+=orn("House Rules")+'<div class="rules">'+
(D.buyIn
  ? '<b>$'+D.buyIn+' a week</b>, Venmo @garretbentham before Sunday. Whole pot to the best record, nothing held back. '
